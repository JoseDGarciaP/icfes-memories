<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1320" media="(prefers-color-scheme: dark)" />
    <title>ICFES Memories</title>
    <!-- Aplica el tema guardado antes de pintar, para evitar el destello blanco en modo oscuro -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('icfes-tema')
          if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
